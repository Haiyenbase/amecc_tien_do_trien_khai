<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMECC × BASE — Scope of Work & Tiến độ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3fa;--card:#ffffff;--ink:#0b1e3f;--ink2:#40557a;--ink3:#8394b0;--rule:#d3deee;--rule2:#e7eef8;--lane:#f6f9fe;
  --brand:#1446a0;--brand2:#0b2d6b;--brandt:#e3ecfb;
  --kd:#0369a1;--qlda:#1d4ed8;--tk:#4338ca;--mh:#0f766e;--hcns:#6d28d9;--kt:#0e7490;--sys:#475f86;
  --s0:#9aa9c2;--s1:#38bdf8;--s2:#f97316;--s3:#16a34a;
  --s0t:#eef2f8;--s1t:#e6f6fe;--s2t:#fff0e5;--s3t:#e6f6ec;--s4:#8b5cf6;--s4t:#f1ecfe;
  --ai:#b45309;--warn:#c81e1e;--prop:#7c3aed;--hl:#fff8e6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1222;--card:#111c31;--ink:#e6edf8;--ink2:#a8b8d4;--ink3:#6e7f9e;--rule:#22324f;--rule2:#1a2742;--lane:#0e1829;
  --brand:#5b8def;--brand2:#0f2350;--brandt:#16264a;
  --kd:#38bdf8;--qlda:#60a5fa;--tk:#a5b4fc;--mh:#2dd4bf;--hcns:#c4b5fd;--kt:#22d3ee;--sys:#94a3c4;
  --s0:#51607c;--s1:#38bdf8;--s2:#fb923c;--s3:#4ade80;
  --s0t:#18233a;--s1t:#0f2a3d;--s2t:#2e1d10;--s3t:#12291b;--s4:#a78bfa;--s4t:#211a38;
  --ai:#fbbf24;--warn:#f87171;--prop:#c4b5fd;--hl:#2a2515;}}
:root[data-theme="dark"]{
  --bg:#0a1222;--card:#111c31;--ink:#e6edf8;--ink2:#a8b8d4;--ink3:#6e7f9e;--rule:#22324f;--rule2:#1a2742;--lane:#0e1829;
  --brand:#5b8def;--brand2:#0f2350;--brandt:#16264a;
  --kd:#38bdf8;--qlda:#60a5fa;--tk:#a5b4fc;--mh:#2dd4bf;--hcns:#c4b5fd;--kt:#22d3ee;--sys:#94a3c4;
  --s0:#51607c;--s1:#38bdf8;--s2:#fb923c;--s3:#4ade80;
  --s0t:#18233a;--s1t:#0f2a3d;--s2t:#2e1d10;--s3t:#12291b;--s4:#a78bfa;--s4t:#211a38;
  --ai:#fbbf24;--warn:#f87171;--prop:#c4b5fd;--hl:#2a2515;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:1400px;margin:0 auto;padding:24px 20px 60px}

/* header */
.head{display:grid;grid-template-columns:1fr auto;background:var(--brand2);color:#fff;border-radius:12px;overflow:hidden}
.head-main{padding:20px 24px}
.head-main .k{font-family:'JetBrains Mono',monospace;font-size:12px;color:#9fbdf5}
.head-main h1{font-size:25px;font-weight:700;letter-spacing:-.3px;line-height:1.2;margin-top:2px}
.head-main p{color:#c8d8f5;margin-top:6px;font-size:13.5px;max-width:78ch}
.head-meta{display:grid;min-width:250px;background:rgba(255,255,255,.06);border-left:1px solid rgba(255,255,255,.12)}
.head-meta div{padding:8px 16px;border-bottom:1px solid rgba(255,255,255,.1);font-size:12px;color:#aac3ee;display:flex;justify-content:space-between;gap:12px;align-items:center}
.head-meta div:last-child{border-bottom:0}
.head-meta b{color:#fff;font-weight:600}
@media(max-width:720px){.head{grid-template-columns:1fr}.head-meta{border-left:0;border-top:1px solid rgba(255,255,255,.12)}.head-main h1{font-size:21px}}
.sync{font-size:11.5px;padding:7px 12px;border-radius:6px;margin-top:10px;background:var(--card);border:1px solid var(--rule);color:var(--ink2);display:flex;gap:8px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--s0);display:inline-block}
.sync.ok i{background:var(--s2)} .sync.ro i{background:var(--ai)}
.tabs{display:flex;gap:6px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.tab{appearance:none;border:1px solid var(--rule);background:var(--card);padding:9px 16px;font:inherit;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;border-radius:8px;display:flex;gap:8px;align-items:center}
.tab .mono{font-size:12px;color:var(--ink3)}
.tab .tp{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:0 7px;border-radius:8px;background:var(--brandt);color:var(--brand)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tab.on .mono{color:#b9cffa}.tab.on .tp{background:rgba(255,255,255,.18);color:#fff}
.panel{display:none;padding-top:16px}.panel.on{display:block}

.bar{height:8px;border-radius:4px;background:var(--rule2);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.pct{font-family:'JetBrains Mono',monospace;font-weight:700}
.box{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.box h4{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.box h4 small{font-weight:500;color:var(--ink3);font-size:12px}

/* overview */
.ov-top{display:grid;grid-template-columns:270px 1fr 1fr;gap:14px}
@media(max-width:960px){.ov-top{grid-template-columns:1fr}}
.big{background:var(--brand);color:#fff;border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.big .l{font-size:13px;color:#cfe0ff}
.big .v{font-family:'JetBrains Mono',monospace;font-size:58px;font-weight:700;line-height:1}
.big .v small{font-size:24px}
.big .bar{background:rgba(255,255,255,.2);width:100%;align-self:stretch} .big .bar span{background:#fff}
.big .ratio{font-size:11.5px;color:#cfe0ff;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.big input{width:46px;font:inherit;font-family:'JetBrains Mono',monospace;font-size:12px;padding:2px 4px;border-radius:4px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;text-align:right}
.obj{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;cursor:pointer}
.obj:hover{border-color:var(--brand)}
.obj-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.obj-h .n{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink3)}
.obj-h h3{font-size:15.5px;font-weight:700;margin-top:2px}
.obj-h .pct{font-size:30px;color:var(--brand)}
.obj>.bar{margin:10px 0 12px;height:10px}
.grp{display:grid;grid-template-columns:1fr 90px 42px;gap:4px 10px;align-items:center;font-size:12.5px;padding:5px 0;border-top:1px solid var(--rule2)}
.grp .gn{color:var(--ink2)} .grp .bar{height:6px} .grp .pct{font-size:12px;text-align:right}
.grp.in{padding-left:16px}.grp.in .gn{font-size:12px}
.ov-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:960px){.ov-row{grid-template-columns:1fr}}
.dist{display:flex;gap:8px;flex-wrap:wrap}
.dist div{flex:1;min-width:92px;border-radius:8px;padding:10px 12px;background:var(--t);border-left:3px solid var(--c)}
.dist b{display:block;font-family:'JetBrains Mono',monospace;font-size:24px;line-height:1.1;color:var(--ink)}
.dist span{font-size:11.5px;color:var(--ink2)}
.mini{list-style:none;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.mini li{font-size:12.5px;display:flex;gap:8px;align-items:baseline;cursor:pointer}
.mini li:hover{color:var(--brand)}
.mini .id{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink3);min-width:52px}
.mini .nt{color:var(--warn);font-size:11.5px;display:block}
.rules{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:12px;color:var(--ink2)}
@media(max-width:600px){.rules{grid-template-columns:1fr 1fr}}
.rules div{border-radius:6px;padding:6px 8px;background:var(--t);border-left:3px solid var(--c)}
.rules b{font-family:'JetBrains Mono',monospace;color:var(--ink)}
.btn{font:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--brand);background:var(--card);color:var(--brand);cursor:pointer}
.btn:hover,.btn.pri{background:var(--brand);color:#fff}
.dtag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--ink2);padding:9px 14px;background:var(--card);border:1px solid var(--rule);border-radius:8px;margin-bottom:12px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.lede{font-size:13px;color:var(--ink2);margin-bottom:12px;max-width:100ch}
.lede b{color:var(--ink)} .lede a{color:var(--brand);cursor:pointer;text-decoration:underline}

/* node card (shared) */
.nd{appearance:none;font:inherit;text-align:left;color:var(--ink);width:100%;position:relative;z-index:3;display:block;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--sc);border-radius:7px;padding:7px 9px 8px;cursor:pointer;transition:box-shadow .12s,border-color .12s}
.nd:hover{box-shadow:0 2px 10px rgba(20,70,160,.14);border-color:var(--brand);border-left-color:var(--sc)}
.nd.ai{background:linear-gradient(0deg,rgba(251,191,36,.07),rgba(251,191,36,.07)),var(--card)}
.nd-t{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nd-t .mono{font-size:10.5px;color:var(--ink3)}
.ty{font-size:9.5px;font-weight:600;padding:0 6px;border-radius:8px;border:1px solid currentColor;white-space:nowrap}
.ty.t-moi{color:var(--qlda)}.ty.t-toi{color:var(--kd)}.ty.t-hc{color:var(--prop)}.ty.t-ai{color:var(--ai)}.ty.t-lk{color:var(--ink)}.ty.t-du{color:var(--mh)}
.nd-n{font-weight:600;font-size:12.5px;line-height:1.3;margin-top:2px}
.nd-s{font-size:11px;color:var(--ink2);line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nd-f{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
.chip{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--t);color:var(--ink);border:1px solid var(--c)}
.nd-f .pct{font-size:11.5px}
.nd .bar{height:3px;margin-top:4px}
.fl{display:inline-block;font-size:9.5px;font-weight:700;padding:0 5px;border-radius:3px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.fl.x{color:var(--ai);border:1px solid var(--ai)}.fl.d{color:var(--prop);border:1px solid var(--prop)}.fl.b{color:var(--warn);border:1px solid var(--warn)}

/* flow (part 1) */
.fc-scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--card);-webkit-overflow-scrolling:touch}
.fc{position:relative;display:grid;grid-template-columns:76px repeat(4,186px) 168px;column-gap:70px;width:max-content;padding-right:12px}
.fc:not(.det) .cell{padding:10px 10px 22px;gap:14px}
.fc:not(.det) .stepc{padding:10px 6px 10px 14px}
.lh{padding:12px 12px 10px;color:#fff;border-radius:0 0 10px 10px}
.lh .n{font-size:14px;font-weight:700}
.lh .p{font-size:11px;opacity:.85}
.lh .r{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.lh .r .pct{font-size:18px}
.lh .r small{font-size:11px;opacity:.9}
.lh .bar{background:rgba(255,255,255,.25);height:5px;margin-top:4px;width:100%}.lh .bar span{background:#fff}
.stepc{padding:16px 8px 16px 16px;border-top:1px dashed var(--rule)}
.stepc .sn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--brand)}
.stepc .st{font-size:12px;color:var(--ink2);line-height:1.35;margin-top:2px}
.cell{padding:16px 12px 34px;display:flex;flex-direction:column;gap:22px;border-top:1px dashed var(--rule);background:var(--lane)}
.wires{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
.w{fill:none;stroke-width:1.5;stroke-linejoin:round}
.w-in{stroke:var(--ink3)} .w-ai{stroke:var(--ai);stroke-dasharray:5 4} .w-h{stroke:var(--brand);stroke-width:2.4}
.mk-in{fill:var(--ink3)} .mk-ai{fill:var(--ai)} .mk-h{fill:var(--brand)}
.hl{position:absolute;z-index:4;transform:translate(-50%,-50%);width:96px;appearance:none;font:inherit;text-align:center;background:var(--card);border:1.5px solid var(--brand);border-radius:8px;padding:5px 6px 6px;cursor:pointer;color:var(--ink);box-shadow:0 2px 8px rgba(20,70,160,.15)}
.hl:hover{background:var(--brandt)}
.hl .hb{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace}
.hl .ht{display:block;font-size:10.5px;font-weight:600;line-height:1.25;margin:3px 0}
.hl .chip{font-size:9.5px}

/* part 2 tiers */
.tiers{display:grid;grid-template-columns:150px minmax(0,1.25fr) 26px minmax(0,1fr) 26px minmax(0,1fr);align-items:stretch}
.tth{background:var(--brand);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:10px}
.tth .tn{font-family:'JetBrains Mono',monospace;font-size:11px;color:#b9cffa}
.tth .tt{font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tth .tt .pct{font-size:18px}
.tth .ts{font-size:11.5px;color:#cfe0ff}
.tth .bar{background:rgba(255,255,255,.22);height:5px;margin-top:6px;width:100%}.tth .bar span{background:#fff}
.tarr{display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:16px;font-weight:700}
.tarr.r{border-top:1px solid var(--rule)}
.drow{display:contents}
.dl{padding:12px 10px 12px 12px;border-top:1px solid var(--rule);border-left:4px solid var(--c);background:var(--card)}
.dl .dn{font-weight:700;font-size:14px;color:var(--c)}
.dl .dp{font-size:11px;color:var(--ink3)}
.dl .pct{font-size:22px;display:block;margin-top:6px}
.dl .bar{height:5px;margin-top:3px}
.dl small{font-size:11px;color:var(--ink3);display:block;margin-top:3px}
.tc{padding:12px 10px;border-top:1px solid var(--rule);background:var(--lane);display:flex;flex-direction:column;gap:6px}
.tc-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink3);font-weight:600}
.tc-h .pct{color:var(--ink);font-size:11.5px}
.gcap{font-size:10.5px;font-weight:700;color:var(--brand);margin-top:4px;display:flex;justify-content:space-between}
.gcap span:last-child{font-family:'JetBrains Mono',monospace;color:var(--ink3)}
.tc .none{font-size:11.5px;color:var(--ink3);font-style:italic;padding:6px 2px}
.tc .nd{padding:6px 8px 7px}
.tc .nd-s{-webkit-line-clamp:1}
@media(max-width:900px){
  .tiers{display:block}
  .tiers>.tth,.tiers>.tarr,.tiers>.blank{display:none}
  .drow{display:block;border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--card)}
  .dl{border-top:0}
  .tarr.r{display:none}
  .tc::before{content:attr(data-t);font-size:11.5px;font-weight:700;color:var(--brand)}
}

/* editor modal */
.ov{position:fixed;inset:0;background:rgba(8,20,45,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.ed{background:var(--card);border-radius:12px;max-width:520px;width:100%;max-height:calc(100% - 20px);overflow:auto;border-top:5px solid var(--c);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.ed-h{padding:16px 18px 10px}
.ed-h .mono{font-size:11.5px;color:var(--ink3)}
.ed-h h3{font-size:17px;line-height:1.3;margin-top:2px}
.ed-h p{font-size:12.5px;color:var(--ink2);margin-top:4px}
.ed-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.ed-b{padding:6px 18px 16px;display:flex;flex-direction:column;gap:12px}
.ed-b label{font-size:11.5px;font-weight:600;color:var(--ink3);display:block;margin-bottom:5px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.seg button{font:inherit;font-size:12px;font-weight:600;padding:8px 4px;border-radius:7px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink2);cursor:pointer;line-height:1.25}
.seg button small{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.8}
.seg button.on{border-color:var(--c);background:var(--t);color:var(--ink)}
.ed-b input,.ed-b textarea{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);width:100%}
.ed-b textarea{min-height:64px;resize:vertical}
.ed-b .sysn{font-size:12px;color:var(--warn)}
.ed-f{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--rule);align-items:center;flex-wrap:wrap}
.ed-f .hint{font-size:11.5px;color:var(--ink3)}
.ro .seg button,.ro .ed-b input,.ro .ed-b textarea{pointer-events:none;opacity:.7}
.foot{margin-top:24px;font-size:11.5px;color:var(--ink3);line-height:1.6}

.nd{user-select:text}
.nd-t .mono{white-space:nowrap}
.nd:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.nd.rem{border-style:dashed;border-left-style:solid;background:repeating-linear-gradient(135deg,var(--card) 0 7px,var(--rule2) 7px 8px)}
.nd.exc{opacity:.45}
.nd.cmp .nd-s{display:none}
.nd-l{display:flex;gap:10px;margin-top:5px;flex-wrap:wrap}
.nd-l a,.lk a{font-size:10.5px;font-weight:600;color:var(--brand);text-decoration:none;border-bottom:1px solid transparent}
.nd-l a:hover,.lk a:hover{border-bottom-color:currentColor}
.nd-l .src,.lk .src{font-size:10px;color:var(--ink3);font-family:'JetBrains Mono',monospace}
.fl.r{color:var(--ink3);border:1px dashed var(--ink3)}
.ty.t-bc{color:var(--s3)}.ty.t-dl{color:var(--mh)}.ty.t-md{color:var(--tk)}.ty.t-dwh{color:var(--sys)}
.lk{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 10px;background:var(--bg);border-radius:6px}
.lk a{font-size:12.5px}
.tgl{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.tgl input{width:auto}

.addb{appearance:none;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink3);background:transparent;border:1px dashed var(--rule);border-radius:7px;padding:5px 8px;cursor:pointer;width:100%;position:relative;z-index:3}
.addb:hover{color:var(--brand);border-color:var(--brand);background:var(--card)}
.cell .addb{opacity:.55}.cell:hover .addb{opacity:1}
.ro .addb,.ro [data-del],.ro [data-restore]{display:none}
.btn.del{border-color:var(--warn);color:var(--warn)}.btn.del:hover{background:var(--warn);color:#fff}
.btn.sm{font-size:11px;padding:2px 8px}
.more summary{font-size:12px;font-weight:600;color:var(--brand);cursor:pointer;padding:2px 0}
.cf{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.cf2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed-b select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);width:100%}

async function shrink(file,maxW,type,q){try{const bm=await createImageBitmap(file);if(bm.width<=maxW&&type===null)return file;const s=Math.min(1,maxW/bm.width);const cv=document.createElement('canvas');cv.width=Math.round(bm.width*s);cv.height=Math.round(bm.height*s);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(b=>r(b||file),type||'image/webp',q||.88));}catch(e){return file;}}
async function uploadShot(id,file){if(READONLY)return;const st=document.getElementById('shotSt');const say=m=>{if(st)st.textContent=m;};
  if(!file.type.startsWith('image/')){say('Chỉ nhận file ảnh');return;}say('Đang tải…');
  const a=await getAssets();
  try{if(a){const blob=await shrink(file,2000,null);const r=await a.upload(blob);const old=cur(IDX[id]).img;await setItem(id,{img:r.id,imgData:null});if(old)a.delete(old).catch(()=>{});}
    else if(MODE==='local'){const blob=await shrink(file,1280,'image/webp',.8);const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});await setItem(id,{imgData:data,img:null});}
    else{say('Bạn không có quyền tải ảnh lên trang này');return;}
    const b=document.getElementById('shotbox');if(b&&EDIT&&EDIT.id===id){b.innerHTML=shotBoxHTML(IDX[id]);bindShot(id);}}
  catch(e){say(e&&e.code==='quota_exceeded'?'Hết dung lượng lưu ảnh':'Tải ảnh không thành công, thử lại');}}
async function removeShot(id){const c=cur(IDX[id]);const a=await getAssets();await setItem(id,{img:null,imgData:null});if(c.img&&a)a.delete(c.img).catch(()=>{});
  const b=document.getElementById('shotbox');if(b){b.innerHTML=shotBoxHTML(IDX[id]);bindShot(id);}}

  catch(e){}finally{const bb=document.getElementById('exph');if(bb){bb.disabled=false;bb.textContent=lbl||'Xuất HTML (kèm ảnh)';}}}
async function exportCSV(){
  const head=['Mục tiêu','Tầng','Tiểu mục','Mã','Hạng mục','Phạm vi','Phòng ban','Loại','Trong phạm vi','Trọng số','Trạng thái','% HT','Căn cứ','Link kết quả','Link hướng dẫn','Ghi chú','Ghi chú cập nhật','Cập nhật lúc'];
  const rows=ITEMS.map(o=>{const c=cur(o);return[o.part===1?'01 Liên kết quy trình':'02 Báo cáo quản trị',o.tier?TIERS[o.tier-1].n+' · '+TIERS[o.tier-1].t:'',o.sub?SUBS[o.sub]:'',o.code,o.t,o.sc,DEPT[o.d][1],TYPES[o.ty],c.ex?'Không':'Có',c.w,STS[c.st][0],c.ex?'':STS[c.st][1],o.src,o.url,o.guide,o.sn,c.note,c.at||''];});
  rows.push([],['Mục tiêu 01','','','','','','','','','','',Math.round(partPct(1))],['Mục tiêu 02','','','','','','','','','','',Math.round(partPct(2))],['Toàn dự án','','','','','','','','','','',Math.round(overall())]);
  const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const cl=(window.claude&&typeof window.claude.use==='function')?window.claude:null;
  if(!dl&&cl)dl=await cl.use('downloads').catch(()=>null);
  if(!dl){alert('Chức năng tải file không khả dụng ở chế độ xem này.');return;}
  try{await dl.save({filename:'AMECC_SOW_tien_do.csv',data:new Blob([csv],{type:'text/csv;charset=utf-8'})});}catch(e){}
}

/* ============ NAV ============ */
function go(p){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.p===p));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===p));if(p==='p1')requestAnimationFrame(drawWires);if(p==='p2')requestAnimationFrame(drawPipes);}
document.addEventListener('mouseover',e=>{const pw=document.getElementById('pw');if(!pw||!pw.contains(e.target))return;const c=e.target.closest('[data-open]');const svg=document.getElementById('pipes');if(!svg)return;
  if(!c){pw.classList.remove('hov');svg.querySelectorAll('.pp.hot').forEach(g=>g.classList.remove('hot'));return;}
  const id=c.dataset.open;pw.classList.add('hov');svg.querySelectorAll('.pp').forEach(g=>g.classList.toggle('hot',g.dataset.a===id||g.dataset.b===id));});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.p));
document.addEventListener('click',e=>{if(e.target.closest('#lb')){if(e.target.closest('[data-lbclose]')||e.target.id==='lb'||e.target.tagName==='IMG')lb.classList.remove('on');return;}const sh=e.target.closest('[data-shot]');if(sh){openShot(sh.dataset.shot);return;}const tb=e.target.closest('[data-t2]');if(tb){T2SEL=tb.dataset.t2;renderTiers();return;}if(e.target.closest('a'))return;const hl=e.target.closest('[data-hand]');if(hl){const c=document.getElementById('hc-'+hl.dataset.hand);if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1400);}return;}const ad=e.target.closest('[data-add]');if(ad){openAdd(JSON.parse(ad.dataset.add));return;}const rs=e.target.closest('[data-restore]');if(rs){setItem(rs.dataset.restore,{del:false});return;}const o=e.target.closest('[data-open]');if(o){openEd(o.dataset.open);return;}const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);window.scrollTo({top:0});}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawWires();drawPipes();},120);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawWires();drawPipes();});
renderAll();initDB();
</script>
